name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Flutter project and add game code
        run: |
          flutter create --project-name ludo_nearby --org com.example --platforms android app
          cp src/main.dart app/lib/main.dart
          cd app
          flutter pub add nearby_connections "permission_handler:^11.3.1" audioplayers
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ['ACCESS_WIFI_STATE', 'CHANGE_WIFI_STATE', 'BLUETOOTH', 'BLUETOOTH_ADMIN',
                   'ACCESS_COARSE_LOCATION', 'ACCESS_FINE_LOCATION', 'BLUETOOTH_ADVERTISE',
                   'BLUETOOTH_CONNECT', 'BLUETOOTH_SCAN', 'NEARBY_WIFI_DEVICES']
          block = ''.join('<uses-permission android:name="android.permission.%s"/>\n    ' % x for x in perms)
          s = s.replace('<application', block + '<application', 1)
          s = s.replace('android:label="ludo_nearby"', 'android:label="Ludo Friends"')
          open(p, 'w').write(s)
          PY
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i 's/flutter\.minSdkVersion/23/' "$f"
          done
      - name: Build APK
        run: |
          cd app
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ludo-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
